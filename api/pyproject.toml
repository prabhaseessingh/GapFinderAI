[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gapfinder-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["alembic>=1.16", "fastapi>=0.116", "groq>=0.31", "httpx>=0.28", "pydantic-settings>=2.10", "PyJWT[crypto]>=2.10", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "redis>=5.0", "tzdata>=2025.2", "uvicorn[standard]>=0.35"]
# tzdata: python:3.12-slim images ship no system zone database, so ZoneInfo("Asia/Kolkata") would fail.

[project.optional-dependencies]
dev = ["mypy>=1.17", "pytest>=8.4", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local test Postgres (TEST_DATABASE_URL)"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true


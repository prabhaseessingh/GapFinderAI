name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint && pnpm web:typecheck && pnpm web:unit-test && pnpm web:build
  api-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: gapfinder, POSTGRES_PASSWORD: gapfinder, POSTGRES_DB: gapfinder_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gapfinder" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gapfinder:gapfinder@localhost:5432/gapfinder_test
      DATABASE_URL: postgresql+psycopg://gapfinder:gapfinder@localhost:5432/gapfinder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e "./api[dev]" -e ./worker
      - run: python -m ruff check api worker && python -m ruff format --check api worker
      - run: cd api && python -m mypy app
      - run: cd api && python -m pytest
      - run: cd api && python -m alembic check
      - run: cd worker && python -m pytest
  image-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node --test "infra/cloudflare-image-worker/test/*.test.js"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/deploy/render/Dockerfile -t gapfinder-render .
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GITLEAKS_CONFIG: .gitleaks.toml}

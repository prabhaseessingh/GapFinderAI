services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gapfinder
      POSTGRES_PASSWORD: gapfinder
      POSTGRES_DB: gapfinder
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapfinder -d gapfinder"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    profiles: ["worker"]
volumes:
  postgres-data:

